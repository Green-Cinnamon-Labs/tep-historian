[tool.poetry]
name = "tep-historian"
version = "0.1.0"
description = "Historian genérico — coleta sinais OPC-UA e serve estatísticas por janela via HTTP para o plant-supervisor"
authors = []
readme = "README.md"
packages = [{ include = "tep_historian", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.34"}
asyncua = "^2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
httpx = "^0.28"
ruff = "^0.11"

[tool.poetry.scripts]
tep-historian = "tep_historian.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
